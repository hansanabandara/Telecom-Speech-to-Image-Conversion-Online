<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Voice to Image Generator</title>
        <style>
            body { 
                font-family: Arial, sans-serif; 
                max-width: 700px; margin: 40px auto; 
                padding: 20px; 
                text-align: center; 
                background-color: #f9f9f9; 
            }
            .container { 
                background: white; 
                padding: 30px; 
                border-radius: 8px; 
                box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            }
            .controls { 
                display: flex; 
                flex-direction: column; 
                gap: 12px; 
                margin-bottom: 20px; 
            }
            input[type="text"], input[type="file"] { 
                padding: 10px; 
                border: 1px solid #dfe4ea; 
                border-radius: 5px; 
                font-size: 14px; 
            }
            .button-row { 
                display: flex; 
                flex-wrap: wrap; 
                justify-content: center; 
                gap: 10px; 
            }
            button { 
                padding: 10px 20px; 
                font-size: 16px; 
                cursor: pointer; 
                border-radius: 5px; 
                border: none; 
            }
            #record-btn { 
                background-color: #ff4757; 
                color: white; 
            }
            #stop-btn { 
                background-color: #2f3542; 
                color: white; 
            }
            #upload-btn { 
                background-color: #1e90ff; 
                color: white; 
            }
            #prompt-btn { 
                background-color: #2ed573; 
                color: white; 
            }
            #stop-btn:disabled { 
                background-color: #ced6e0; 
                cursor: not-allowed; 
            }
            #status { 
                margin-top: 15px; 
                font-weight: bold; 
                color: #57606f; 
            }
            #transcription { 
                margin-top: 15px; 
                font-style: italic; 
                color: #2f3542; 
                white-space: pre-wrap; 
            }
            #result-image { 
                margin-top: 20px; 
                max-width: 100%; 
                border-radius: 8px; 
                display: none; 
                box-shadow: 0 4px 8px rgba(0,0,0,0.15); 
            }
        </style>
    </head>
    <body>

        <div class="container">
            <h2>Voice-to-Image Generator</h2>

            <div class="controls">
                <input id="prompt-input" type="text" placeholder="Enter a prompt for the image (optional)" />
                <input id="audio-file" type="file" accept=".mp3,audio/mpeg,audio/*" />

                <div class="button-row">
                    <button id="record-btn">Start Recording</button>
                    <button id="stop-btn" disabled>Stop & Generate</button>
                    <button id="upload-btn">Upload Audio & Generate</button>
                    <button id="prompt-btn">Generate from Prompt</button>
                </div>
            </div>

            <div id="status">Status: Idle</div>
            <div id="transcription"></div>
            
            <img id="result-image" alt="Generated output" />
        </div>

        <script>
            let mediaRecorder;
            let audioChunks = [];
            const recordBtn = document.getElementById('record-btn');
            const stopBtn = document.getElementById('stop-btn');
            const uploadBtn = document.getElementById('upload-btn');
            const promptBtn = document.getElementById('prompt-btn');
            const promptInput = document.getElementById('prompt-input');
            const audioFileInput = document.getElementById('audio-file');
            const statusDiv = document.getElementById('status');
            const transcriptionDiv = document.getElementById('transcription');
            const resultImage = document.getElementById('result-image');

            recordBtn.addEventListener('click', async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await processVoiceAndImage(audioBlob, 'recording.wav');
                    };

                    mediaRecorder.start();
                    statusDiv.innerText = "Status: Recording... Speak now!";
                    recordBtn.disabled = true;
                    stopBtn.disabled = false;
                } catch (err) {
                    alert("Error accessing microphone.");
                    console.error(err);
                }
            });

            stopBtn.addEventListener('click', () => {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                statusDiv.innerText = "Status: Processing audio...";
                recordBtn.disabled = false;
                stopBtn.disabled = true;
            });

            uploadBtn.addEventListener('click', async () => {
                const selectedFile = audioFileInput.files[0];
                const promptText = promptInput.value.trim();

                if (selectedFile) {
                    await processVoiceAndImage(selectedFile, selectedFile.name);
                    return;
                }

                if (promptText) {
                    await generateFromPrompt(promptText);
                    return;
                }

                alert("Please choose an audio file or enter a prompt first.");
            });

            promptBtn.addEventListener('click', async () => {
                const promptText = promptInput.value.trim();

                if (!promptText) {
                    alert("Please enter a prompt first.");
                    return;
                }

                await generateFromPrompt(promptText);
            });

            async function generateFromPrompt(promptText) {
                try {
                    statusDiv.innerText = "Status: Generating image from prompt...";
                    transcriptionDiv.innerText = `Prompt: "${promptText}"`;

                    const encodedPrompt = encodeURIComponent(promptText);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=flux&width=512&height=512`;

                    resultImage.src = imageUrl;
                    resultImage.style.display = "block";

                    resultImage.onload = () => {
                        statusDiv.innerText = "Status: Image generated successfully!";
                    };
                } catch (error) {
                    statusDiv.innerText = "Status: Error processing request";
                    console.error(error);
                }
            }

            async function processVoiceAndImage(audioSource, fileName) {
                try {
                    statusDiv.innerText = "Status: Transcribing voice via local server...";
                    transcriptionDiv.innerText = '';
                    
                    const formData = new FormData();
                    formData.append("file", audioSource, fileName || "recording.wav");

                    const response = await fetch("/api/transcribe", {
                        method: "POST",
                        body: formData
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        const bodyText = errorText ? `: ${errorText}` : '';
                        throw new Error(`Server returned error status ${response.status}${bodyText}`);
                    }

                    const data = await response.json();
                    const transcribedText = data.text || "";
                    const imagePrompt = data.prompt || transcribedText;
                    
                    transcriptionDiv.innerText = transcribedText
                        ? `Transcription: "${transcribedText}"\nPrompt: "${imagePrompt}"`
                        : `Prompt: "${imagePrompt}"`;

                    statusDiv.innerText = "Status: Generating image...";
                    const encodedPrompt = encodeURIComponent(imagePrompt);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?model=flux&width=512&height=512`;

                    resultImage.src = imageUrl;
                    resultImage.style.display = "block";

                    resultImage.onload = () => {
                        statusDiv.innerText = "Status: Image generated successfully!";
                    };

                } catch (error) {
                    const message = error?.message || 'Unknown error';
                    statusDiv.innerText = `Status: ${message}`;
                    transcriptionDiv.innerText = message;
                    console.error(error);
                }
            }
        </script>
    </body>
</html>
